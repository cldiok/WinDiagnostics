[package]
name = "pc_toolkit"
version = "1.0.0"
edition = "2021"

[dependencies]
sysinfo = "0.39.0"
colored = "3.1.1"
dialoguer = "0.12.0"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winapi = { version = "0.3", features = ["wincon", "consoleapi", "processenv", "winbase"]}

[build-dependencies]
embed-resource = "2"
